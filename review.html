<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SummitPoint | Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


</head>

<body>

    <nav class="fixed-top">
        <a href="index.html">Overview</a>
        <a href="signup.html">Event Registration</a>
        <a href="speakers.html">Speaker Reservations</a>
        <a href="materials.html">Material Management</a>
        <a href="submissions.html">Session Suggestion</a>
    </nav>

    <!--We can remove the banner later if we like, its mostly just for content right now.-->
    <section class="banner" aria-label="Page banner">
        <img src="imgs\Banner.jpg" alt="banner image">
    </section>

    <section class="content" aria-label="Main content">
        <div class="material-form mx-auto col-md-8 bg-white p-4 rounded shadow-sm">

            <div class="table-header">
                <h5>Submissions Review</h5>
            <!-- JQUERY SEARCH -->
                <p>Search and review submissions for approval</p>
                <!--Search bar, will need JavaScript/jQuery to work.-->
                <label class="visually-hidden" for="submission-search">Search submissions</label>
                <input class="form-control submission-search" type="search" id="submission-search" placeholder="Search by ID, title, category, speaker, etc." autocomplete="off">
                <button class="icon-button"><img src="icons/filter.svg" alt="filter" class="search-icon"></button>
                <button class="icon-button sort-down"><img src="icons/arrow_down.svg" alt="descending" class="search-icon"></button>
                <button class="icon-button sort-up"><img src="icons/arrow_up.svg" alt="ascending" class="search-icon"></button>
            </div>
            <p class="submission-result-count" id="submission-result-count" aria-live="polite">Results: NA</p>
            <div class="material-table" tabindex="0" aria-label="Scrollable submissions">
            <!--TABLE FOR DISPLAYING THE JSON DATA. CONTENTS ARE VISUAL TILL WE GET WORKING JSON DATA FOR THE TABLE-->    
                <table class="table table-striped table-hover align-middle mb-0" id="material-table">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Time</th>
                            <th>Duration</th>
                            <th>Category</th>
                            <th>Speaker</th>
                            <th>Abstract</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="submission-table-body">
                        <!--Submissions from submissions.html will be shown here using AngularJS-->
                    </tbody>
                </table>
                <p class="submission-no-results" id="submission-no-results" hidden>No submissions match your search.</p>
            </div>
        </div>
    </section>

    <section class="footer" aria-label="Page footer">
        <p>&copy; 2026 SummitPoint. All rights reserved.</p>
    </section>    
</body>

</html>
