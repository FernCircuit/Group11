
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!--Nav bar. The events.html and materials.html are just placeholders at the moment.-->
    <nav>
        <a href="index.html">Overview</a>
        <a href="signup.html">Attendees</a>
        <a href="events.html">Schedule</a>
        <a href="materials.html">Material Management</a>
    </nav>

    <!--We can remove the banner later if we like, its mostly just for content right now.-->
    <section class="banner" aria-label="Page banner">
        <img src="imgs\Banner.jpg" alt="banner image">
    </section>

    <!--
    Matches the homepage. Section below for Sign-Up form:
    -->
    <section class="content" aria-label="Main content">
        <!-- START FORM -->
        <div class="form-container">
            <form id="sign-up">
            <!--Part 1: Point of Contact Information-->
            <fieldset>
             <!-- POC FIRST NAME -->
                <legend>Point of Contact</legend>
                <div class="form-item">
                  <label for="poc-firstname">First Name:</label>
                  <input type="text" name="poc-firstname" id="poc-firstname" required>
                </div>
                <!-- POC LAST NAME -->
                <div class="form-item">
                    <label for="poc-lastname">Last Name:</label>
                    <input type="text" name="poc-lastname" id="poc-lastname" required>
                </div>
            <!-- POC EMAIL -->
            <div class="form-item">
              <label for="poc-email">Email Address:</label>
              <input type="email" name="poc-email" id="poc-email" required>
            </div>
        <!-- POC PHONE -->
            <div class="form-item">
              <label for="poc-phone">Phone Number:</label>
              <input type="tel" name="poc-phone" id="poc-phone">
           </div>
        <!-- POC PREFERRED METHOD -->
        <div class="form-item">
              <label>Preferred Method of Contact:</label>
              <input type="radio" name="poc-method" id="poc-method-email" value="email">
              <label for="poc-method-email">Email</label>
              <input type="radio" name="poc-method" id="poc-method-phone" value="phone">
              <label for="poc-method-phone">Phone</label>
        </div>
      </fieldset>
  <!------------------------------------>
  <!--Part 2: Organization Information-->
  <!------------------------------------>
  <fieldset>
    <legend>Group Information</legend>
    <!-- NUMBER ATTENDEES -->
    <div class="form-item">
      <label for="max-attendees">Maximum Number of Attendees:</label>
      <select name="max-attendees" id="max-attendees">
        <option value="250">250</option>
        <option value="500">500</option>
        <option value="1500">1,500</option>
        <option value="2000">2,000</option>
        <option value="2500">2,500</option>
        <option value="3000">3,000</option>
        <option value="4500">4,500</option>
        <option value="5000">5,000</option>
      </select>
    </div>
    <!-- ORGANIZATION NAME -->
    <div class="form-item">
      <label for="org-name">Organization:</label>
      <input type="text" name="org-name" id="org-name" required>
    </div>
    <!-- INDUSTRY DROPDOWN -->
    <div class="form-item">
      <label for="org-industry">Industry:</label>
      <select name="org-industry" id="org-industry">
        <option value="tech">Technology & Software</option>
        <option value="heal">Healthcare & Life Sciences</option>
        <option value="fina">Finance & Insurance</option>
        <option value="educ">Education</option>
        <option value="nonp">Non-Profit & Philanthropy</option>
        <option value="gove">Government</option>
        <option value="manu">Manufacturing & Logistics</option>
        <option value="reta">Retail & Consumer Goods</option>
        <option value="prof">Professional Services</option>
        <option value="medi">Media & Entertainment</option>
        <option value="ener">Energy & Utilities</option>
        <option value="real">Real Estate & Construction</option>
      </select>
    </div>
    <!-- REQUESTED CONFERENCE DATES -->
    <div class="form-item">
      <label for="org-date">Requested Start Date:</label>
      <input type="date" name="org-date" id="org-date-start">
      <label for="org-date">Requested End Date:</label>
      <input type="date" name="org-date" id="org-date-end">
    </div>
    <!-- SPECIAL REQUEST BOX -->
    <div class="form-item">
      <label for="org-requests">Special Requests:</label><br>
      <textarea name="org-requests" id="org-requests" rows="5" cols="40" placeholder="Enter requests here..."></textarea>
    </div>
  </fieldset>
  <input type="submit" name="submit" value="Submit">
</form>
    </section>
    <section class="footer" aria-label="Page footer">
        <p>&copy; 2026 Your Website. All rights reserved.</p>
    </section>


</body>

</html>
